<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nima AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg1: #0a0a14;
    --bg2: #12122a;
    --accent: #a855f7;
    --accent2: #6366f1;
    --text: #e5e7eb;
    --muted: #8b8b9e;
    --user-bubble: linear-gradient(135deg, #6366f1, #a855f7);
    --bot-bubble: rgba(255, 255, 255, 0.04);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 0%, #1a1a3a 0%, var(--bg1) 50%),
                radial-gradient(circle at 80% 100%, #2a1a3a 0%, var(--bg2) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 14px;
    backdrop-filter: blur(12px);
    background: rgba(10, 10, 20, 0.5);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    display: grid; place-items: center;
    font-weight: 800; font-size: 20px; color: white;
    box-shadow: 0 0 24px rgba(168, 85, 247, 0.5);
  }

  .title { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
  .subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; margin-left: auto;
    box-shadow: 0 0 10px #22c55e;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.4; } }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px 120px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    scroll-behavior: smooth;
  }

  .msg {
    display: flex;
    margin-bottom: 18px;
    animation: slideIn 0.35s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { justify-content: flex-end; }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 18px;
    line-height: 1.55;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .user .bubble {
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
  }

  .bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid rgba(255,255,255,0.07);
    border-bottom-left-radius: 4px;
    backdrop-filter: blur(8px);
  }

  .avatar {
    width: 34px; height: 34px;
    border-radius: 10px;
    display: grid; place-items: center;
    font-weight: 700; font-size: 14px;
    flex-shrink: 0;
    margin-right: 10px;
  }
  .bot .avatar {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: white;
  }

  .typing { display: inline-flex; gap: 4px; align-items: center; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .input-wrap {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 16px;
    background: linear-gradient(to top, var(--bg1) 60%, transparent);
    backdrop-filter: blur(10px);
  }

  .input-box {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 8px 8px 8px 18px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15);
  }

  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    padding: 10px 0;
    font-family: inherit;
  }

  #input::placeholder { color: var(--muted); }

  #send {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    transition: transform 0.15s, opacity 0.2s;
  }

  #send:hover { transform: translateY(-1px); }
  #send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .welcome {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
  .welcome h2 {
    color: var(--text);
    font-size: 26px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #a855f7, #6366f1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .welcome p { font-size: 14px; }

  @media (max-width: 600px) {
    .bubble { max-width: 88%; font-size: 14px; }
    .title { font-size: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">N</div>
  <div>
    <div class="title">Nima AI</div>
    <div class="subtitle">smart · witty · slightly rebellious</div>
  </div>
  <div class="status-dot" id="status"></div>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <h2>Hey, I'm Nima.</h2>
    <p>Ask me anything. I don't do corporate fluff.</p>
  </div>
</div>

<div class="input-wrap">
  <div class="input-box">
    <input id="input" type="text" placeholder="Type your message..." autocomplete="off" />
    <button id="send">Send</button>
  </div>
</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const welcome = document.getElementById("welcome");
  const status = document.getElementById("status");

  let history = [];
  let busy = false;

  function addMessage(role, text) {
    if (welcome) welcome.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;
    if (role === "bot") {
      div.innerHTML = `<div class="avatar">N</div><div class="bubble"></div>`;
      div.querySelector(".bubble").textContent = text;
    } else {
      div.innerHTML = `<div class="bubble"></div>`;
      div.querySelector(".bubble").textContent = text;
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "msg bot";
    div.id = "typing";
    div.innerHTML = `<div class="avatar">N</div>
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || busy) return;

    busy = true;
    send.disabled = true;
    input.value = "";

    addMessage("user", text);
    history.push({ role: "user", content: text });

    const typing = addTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      typing.remove();

      if (data.error) {
        addMessage("bot", "⚠️ " + data.error);
        status.style.background = "#ef4444";
        status.style.boxShadow = "0 0 10px #ef4444";
      } else {
        addMessage("bot", data.reply);
        history.push({ role: "assistant", content: data.reply });
        status.style.background = "#22c55e";
        status.style.boxShadow = "0 0 10px #22c55e";
      }
    } catch (err) {
      typing.remove();
      addMessage("bot", "⚠️ Network error: " + err.message);
    } finally {
      busy = false;
      send.disabled = false;
      input.focus();
    }
  }

  send.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.focus();
</script>

</body>
  </html>
