<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nima AI</title>

<!-- Markdown + highlighting libs -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg1: #050708;
    --bg2: #0a1410;
    --accent: #22c55e;
    --accent2: #10b981;
    --accent-glow: rgba(34, 197, 94, 0.45);
    --text: #e5e7eb;
    --muted: #7a8a80;
    --user-bubble: linear-gradient(135deg, #10b981, #22c55e);
    --bot-bubble: rgba(255, 255, 255, 0.035);
    --border: rgba(34, 197, 94, 0.15);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #0f2a1e 0%, var(--bg1) 45%),
      radial-gradient(circle at 85% 100%, #0a1f18 0%, var(--bg2) 55%),
      #050708;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    backdrop-filter: blur(14px);
    background: rgba(5, 7, 8, 0.7);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo {
    width: 44px; height: 44px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 22px var(--accent-glow), 0 0 4px rgba(34, 197, 94, 0.9);
    flex-shrink: 0;
    background: #000;
    border: 1px solid rgba(34, 197, 94, 0.3);
  }

  .title {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #f3f4f6 0%, #22c55e 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.2px;
  }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; margin-left: auto;
    box-shadow: 0 0 10px #22c55e;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.35; } }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 14px 120px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    scroll-behavior: smooth;
  }

  .msg {
    display: flex;
    margin-bottom: 18px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { justify-content: flex-end; }

  .bubble {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 18px;
    line-height: 1.6;
    font-size: 15px;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .user .bubble {
    background: var(--user-bubble);
    color: #04140b;
    font-weight: 500;
    border-bottom-right-radius: 4px;
    box-shadow: 0 6px 22px rgba(34, 197, 94, 0.28);
    white-space: pre-wrap;
  }

  .bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    backdrop-filter: blur(8px);
    max-width: 95%;
    overflow-x: auto;
  }

  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    margin-right: 10px;
    background: #000;
    border: 1px solid rgba(34, 197, 94, 0.35);
    box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
  }

  /* ===== Markdown styling inside bot bubble ===== */
  .bot .bubble p { margin: 0 0 10px; }
  .bot .bubble p:last-child { margin-bottom: 0; }

  .bot .bubble h1,
  .bot .bubble h2,
  .bot .bubble h3,
  .bot .bubble h4 {
    margin: 14px 0 8px;
    line-height: 1.3;
    color: #f3f4f6;
  }
  .bot .bubble h1 {
    font-size: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
    color: #22c55e;
  }
  .bot .bubble h2 {
    font-size: 17px;
    color: #4ade80;
  }
  .bot .bubble h3 { font-size: 15px; color: #86efac; }
  .bot .bubble h4 { font-size: 14px; }

  .bot .bubble ul,
  .bot .bubble ol {
    margin: 8px 0 10px;
    padding-left: 22px;
  }
  .bot .bubble li { margin: 4px 0; }
  .bot .bubble li::marker { color: var(--accent); }

  .bot .bubble strong { color: #f3f4f6; font-weight: 700; }
  .bot .bubble em { color: #86efac; font-style: italic; }

  .bot .bubble a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px dotted var(--accent);
  }

  .bot .bubble blockquote {
    border-left: 3px solid var(--accent);
    padding: 6px 12px;
    margin: 10px 0;
    background: rgba(34, 197, 94, 0.08);
    border-radius: 4px;
    color: #cbd5e1;
    font-size: 14px;
  }

  .bot .bubble hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 14px 0;
  }

  /* Tables */
  .bot .bubble table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 13px;
    display: block;
    overflow-x: auto;
    white-space: nowrap;
  }
  .bot .bubble th,
  .bot .bubble td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .bot .bubble th {
    background: rgba(34, 197, 94, 0.18);
    font-weight: 700;
    color: #86efac;
  }
  .bot .bubble tr:nth-child(even) td {
    background: rgba(255, 255, 255, 0.02);
  }

  /* Inline code */
  .bot .bubble code:not(pre code) {
    background: rgba(34, 197, 94, 0.15);
    color: #86efac;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, monospace;
    font-size: 13px;
  }

  /* Code blocks with copy button */
  .code-wrap {
    position: relative;
    margin: 10px 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #0a0f0d;
  }

  .code-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    background: rgba(34, 197, 94, 0.08);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: #86efac;
    font-family: ui-monospace, monospace;
    text-transform: lowercase;
  }

  .copy-btn {
    background: rgba(34, 197, 94, 0.18);
    border: 1px solid rgba(34, 197, 94, 0.45);
    color: #86efac;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, transform 0.1s;
  }
  .copy-btn:hover { background: rgba(34, 197, 94, 0.32); }
  .copy-btn:active { transform: scale(0.95); }
  .copy-btn.copied {
    background: rgba(34, 197, 94, 0.5);
    border-color: rgba(34, 197, 94, 0.9);
    color: #ffffff;
  }

  .code-wrap pre {
    margin: 0;
    padding: 12px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.5;
  }
  .code-wrap pre code {
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, monospace;
    background: transparent !important;
    padding: 0 !important;
  }

  /* Typing dots */
  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s infinite;
    box-shadow: 0 0 6px var(--accent);
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .input-wrap {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 14px;
    background: linear-gradient(to top, #050708 70%, transparent);
    backdrop-filter: blur(10px);
  }

  .input-box {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    background: rgba(255,255,255,0.045);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 6px 6px 6px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
  }

  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    padding: 10px 0;
    font-family: inherit;
    min-width: 0;
  }
  #input::placeholder { color: var(--muted); }

  #send {
    background: linear-gradient(135deg, #10b981, #22c55e);
    border: none;
    color: #04140b;
    padding: 10px 18px;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
    transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
    flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(34, 197, 94, 0.35);
  }
  #send:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(34, 197, 94, 0.5);
  }
  #send:disabled {
    opacity: 0.4; cursor: not-allowed; transform: none;
    box-shadow: none;
  }

  .welcome {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
  .welcome .welcome-logo {
    width: 90px; height: 90px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 18px;
    display: block;
    box-shadow: 0 0 40px var(--accent-glow), 0 0 8px rgba(34, 197, 94, 0.8);
    border: 1px solid rgba(34, 197, 94, 0.35);
    background: #000;
  }
  .welcome h2 {
    font-size: 24px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #f3f4f6, #22c55e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .welcome p { font-size: 14px; }

  @media (max-width: 600px) {
    .bubble { font-size: 14px; max-width: 92%; }
    .bot .bubble { max-width: 98%; }
    .title { font-size: 15px; }
    .logo { width: 40px; height: 40px; }
    .avatar { width: 30px; height: 30px; margin-right: 8px; }
  }
</style>
</head>
<body>

<header>
  <img class="logo" src="/static/logo.png" alt="Nima" />
  <div>
    <div class="title">NIMA AI</div>
    <div class="subtitle">smart · witty · slightly rebellious</div>
  </div>
  <div class="status-dot" id="status"></div>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <img class="welcome-logo" src="/static/logo.png" alt="Nima" />
    <h2>Hey, I'm Nima.</h2>
    <p>Ask me anything. I don't do corporate fluff.</p>
  </div>
</div>

<div class="input-wrap">
  <div class="input-box">
    <input id="input" type="text" placeholder="Type your message..." autocomplete="off" />
    <button id="send">Send</button>
  </div>
</div>

<script>
  marked.setOptions({
    breaks: true,
    gfm: true,
    highlight: function (code, lang) {
      try {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      } catch (e) {
        return code;
      }
    }
  });

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const welcome = document.getElementById("welcome");
  const status = document.getElementById("status");

  let history = [];
  let busy = false;

  function renderMarkdown(text) {
    const rawHtml = marked.parse(text);
    return DOMPurify.sanitize(rawHtml);
  }

  function attachCopyButtons(container) {
    container.querySelectorAll("pre").forEach((pre) => {
      if (pre.parentElement.classList.contains("code-wrap")) return;

      const code = pre.querySelector("code");
      const langMatch = code && code.className.match(/language-(\w+)/);
      const lang = langMatch ? langMatch[1] : "code";

      const wrap = document.createElement("div");
      wrap.className = "code-wrap";

      const head = document.createElement("div");
      head.className = "code-head";
      const label = document.createElement("span");
      label.textContent = lang;
      head.appendChild(label);

      const btn = document.createElement("button");
      btn.className = "copy-btn";
      btn.textContent = "Copy";

      btn.addEventListener("click", () => {
        const txt = code ? code.innerText : pre.innerText;
        const done = () => {
          btn.textContent = "Copied!";
          btn.classList.add("copied");
          setTimeout(() => {
            btn.textContent = "Copy";
            btn.classList.remove("copied");
          }, 1600);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(done).catch(() => {
            const ta = document.createElement("textarea");
            ta.value = txt;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            done();
          });
        } else {
          const ta = document.createElement("textarea");
          ta.value = txt;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          done();
        }
      });

      head.appendChild(btn);

      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(head);
      wrap.appendChild(pre);
    });
  }

  function addMessage(role, text) {
    if (welcome) welcome.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;

    if (role === "bot") {
      div.innerHTML = `<img class="avatar" src="/static/logo.png" alt="N" /><div class="bubble"></div>`;
      const bubble = div.querySelector(".bubble");
      bubble.innerHTML = renderMarkdown(text);
      attachCopyButtons(bubble);
    } else {
      div.innerHTML = `<div class="bubble"></div>`;
      div.querySelector(".bubble").textContent = text;
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "msg bot";
    div.id = "typing";
    div.innerHTML = `<img class="avatar" src="/static/logo.png" alt="N" />
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || busy) return;

    busy = true;
    send.disabled = true;
    input.value = "";

    addMessage("user", text);
    history.push({ role: "user", content: text });

    const typing = addTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      typing.remove();

      if (data.error) {
        addMessage("bot", "⚠️ " + data.error);
        status.style.background = "#ef4444";
        status.style.boxShadow = "0 0 10px #ef4444";
      } else {
        addMessage("bot", data.reply);
        history.push({ role: "assistant", content: data.reply });
        status.style.background = "#22c55e";
        status.style.boxShadow = "0 0 10px #22c55e";
      }
    } catch (err) {
      typing.remove();
      addMessage("bot", "⚠️ Network error: " + err.message);
    } finally {
      busy = false;
      send.disabled = false;
      input.focus();
    }
  }

  send.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.focus();
</script>

</body>
</html>
