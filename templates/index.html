<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nima AI</title>

<!-- Markdown + highlighting libs -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg1: #0a0a14;
    --bg2: #12122a;
    --accent: #a855f7;
    --accent2: #6366f1;
    --text: #e5e7eb;
    --muted: #8b8b9e;
    --user-bubble: linear-gradient(135deg, #6366f1, #a855f7);
    --bot-bubble: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.08);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 0%, #1a1a3a 0%, var(--bg1) 50%),
                radial-gradient(circle at 80% 100%, #2a1a3a 0%, var(--bg2) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    backdrop-filter: blur(12px);
    background: rgba(10, 10, 20, 0.6);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    display: grid; place-items: center;
    font-weight: 800; font-size: 18px; color: white;
    box-shadow: 0 0 20px rgba(168, 85, 247, 0.45);
    flex-shrink: 0;
  }

  .title { font-size: 16px; font-weight: 700; letter-spacing: 0.3px; }
  .subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; margin-left: auto;
    box-shadow: 0 0 10px #22c55e;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.4; } }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 14px 120px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    scroll-behavior: smooth;
  }

  .msg {
    display: flex;
    margin-bottom: 18px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { justify-content: flex-end; }

  .bubble {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 18px;
    line-height: 1.6;
    font-size: 15px;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .user .bubble {
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
    white-space: pre-wrap;
  }

  .bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    backdrop-filter: blur(8px);
    max-width: 95%;
    overflow-x: auto;
  }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 10px;
    display: grid; place-items: center;
    font-weight: 700; font-size: 13px;
    flex-shrink: 0;
    margin-right: 8px;
  }
  .bot .avatar {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: white;
  }

  /* Markdown styling inside bot bubble */
  .bot .bubble p { margin: 0 0 10px; }
  .bot .bubble p:last-child { margin-bottom: 0; }
  .bot .bubble h1,
  .bot .bubble h2,
  .bot .bubble h3,
  .bot .bubble h4 {
    margin: 14px 0 8px;
    line-height: 1.3;
    color: #f3f4f6;
  }
  .bot .bubble h1 { font-size: 20px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .bot .bubble h2 { font-size: 17px; }
  .bot .bubble h3 { font-size: 15px; }
  .bot .bubble h4 { font-size: 14px; }

  .bot .bubble ul,
  .bot .bubble ol {
    margin: 8px 0 10px;
    padding-left: 22px;
  }
  .bot .bubble li { margin: 4px 0; }

  .bot .bubble strong { color: #f3f4f6; font-weight: 700; }
  .bot .bubble em { color: #c4b5fd; font-style: italic; }

  .bot .bubble a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px dotted var(--accent);
  }

  .bot .bubble blockquote {
    border-left: 3px solid var(--accent);
    padding: 6px 12px;
    margin: 10px 0;
    background: rgba(168, 85, 247, 0.08);
    border-radius: 4px;
    color: #cbd5e1;
    font-size: 14px;
  }

  .bot .bubble hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 14px 0;
  }

  /* Tables */
  .bot .bubble table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 13px;
    display: block;
    overflow-x: auto;
    white-space: nowrap;
  }
  .bot .bubble th,
  .bot .bubble td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .bot .bubble th {
    background: rgba(168, 85, 247, 0.15);
    font-weight: 700;
  }
  .bot .bubble tr:nth-child(even) td {
    background: rgba(255, 255, 255, 0.02);
  }

  /* Inline code */
  .bot .bubble code:not(pre code) {
    background: rgba(168, 85, 247, 0.15);
    color: #e9d5ff;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, monospace;
    font-size: 13px;
  }

  /* Code blocks with copy button */
  .code-wrap {
    position: relative;
    margin: 10px 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #0d1117;
  }

  .code-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    background: rgba(255, 255, 255, 0.04);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    font-family: ui-monospace, monospace;
  }

  .copy-btn {
    background: rgba(168, 85, 247, 0.2);
    border: 1px solid rgba(168, 85, 247, 0.4);
    color: #e9d5ff;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .copy-btn:hover { background: rgba(168, 85, 247, 0.35); }
  .copy-btn.copied {
    background: rgba(34, 197, 94, 0.25);
    border-color: rgba(34, 197, 94, 0.5);
    color: #86efac;
  }

  .code-wrap pre {
    margin: 0;
    padding: 12px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.5;
  }
  .code-wrap pre code {
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, monospace;
    background: transparent !important;
    padding: 0 !important;
  }

  /* Typing dots */
  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .input-wrap {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 14px;
    background: linear-gradient(to top, var(--bg1) 70%, transparent);
    backdrop-filter: blur(10px);
  }

  .input-box {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 6px 6px 6px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15);
  }

  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    padding: 10px 0;
    font-family: inherit;
    min-width: 0;
  }
  #input::placeholder { color: var(--muted); }

  #send {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none;
    color: white;
    padding: 10px 18px;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    transition: transform 0.15s, opacity 0.2s;
    flex-shrink: 0;
  }
  #send:hover { transform: translateY(-1px); }
  #send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .welcome {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
  .welcome h2 {
    color: var(--text);
    font-size: 24px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #a855f7, #6366f1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .welcome p { font-size: 14px; }

  @media (max-width: 600px) {
    .bubble { font-size: 14px; max-width: 92%; }
    .bot .bubble { max-width: 98%; }
    .title { font-size: 15px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">N</div>
  <div>
    <div class="title">Nima AI</div>
    <div class="subtitle">smart · witty · slightly rebellious</div>
  </div>
  <div class="status-dot" id="status"></div>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <h2>Hey, I'm Nima.</h2>
    <p>Ask me anything. I don't do corporate fluff.</p>
  </div>
</div>

<div class="input-wrap">
  <div class="input-box">
    <input id="input" type="text" placeholder="Type your message..." autocomplete="off" />
    <button id="send">Send</button>
  </div>
</div>

<script>
  // Configure marked
  marked.setOptions({
    breaks: true,
    gfm: true,
    highlight: function (code, lang) {
      try {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      } catch (e) {
        return code;
      }
    }
  });

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const welcome = document.getElementById("welcome");
  const status = document.getElementById("status");

  let history = [];
  let busy = false;

  function renderMarkdown(text) {
    const rawHtml = marked.parse(text);
    return DOMPurify.sanitize(rawHtml);
  }

  function attachCopyButtons(container) {
    container.querySelectorAll("pre").forEach((pre) => {
      if (pre.parentElement.classList.contains("code-wrap")) return;

      const code = pre.querySelector("code");
      const langMatch = code && code.className.match(/language-(\w+)/);
      const lang = langMatch ? langMatch[1] : "code";

      const wrap = document.createElement("div");
      wrap.className = "code-wrap";

      const head = document.createElement("div");
      head.className = "code-head";
      head.innerHTML = `<span>${lang}</span>`;

      const btn = document.createElement("button");
      btn.className = "copy-btn";
      btn.textContent = "Copy";
      btn.addEventListener("click", () => {
        const txt = code ? code.innerText : pre.innerText;
        navigator.clipboard.writeText(txt).then(() => {
          btn.textContent = "Copied!";
          btn.classList.add("copied");
          setTimeout(() => {
            btn.textContent = "Copy";
            btn.classList.remove("copied");
          }, 1600);
        }).catch(() => {
          // fallback
          const ta = document.createElement("textarea");
          ta.value = txt;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          btn.textContent = "Copied!";
          btn.classList.add("copied");
          setTimeout(() => {
            btn.textContent = "Copy";
            btn.classList.remove("copied");
          }, 1600);
        });
      });

      head.appendChild(btn);

      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(head);
      wrap.appendChild(pre);
    });
  }

  function addMessage(role, text) {
    if (welcome) welcome.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;

    if (role === "bot") {
      div.innerHTML = `<div class="avatar">N</div><div class="bubble"></div>`;
      const bubble = div.querySelector(".bubble");
      bubble.innerHTML = renderMarkdown(text);
      attachCopyButtons(bubble);
    } else {
      div.innerHTML = `<div class="bubble"></div>`;
      div.querySelector(".bubble").textContent = text;
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "msg bot";
    div.id = "typing";
    div.innerHTML = `<div class="avatar">N</div>
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || busy) return;

    busy = true;
    send.disabled = true;
    input.value = "";

    addMessage("user", text);
    history.push({ role: "user", content: text });

    const typing = addTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      typing.remove();

      if (data.error) {
        addMessage("bot", "⚠️ " + data.error);
        status.style.background = "#ef4444";
        status.style.boxShadow = "0 0 10px #ef4444";
      } else {
        addMessage("bot", data.reply);
        history.push({ role: "assistant", content: data.reply });
        status.style.background = "#22c55e";
        status.style.boxShadow = "0 0 10px #22c55e";
      }
    } catch (err) {
      typing.remove();
      addMessage("bot", "⚠️ Network error: " + err.message);
    } finally {
      busy = false;
      send.disabled = false;
      input.focus();
    }
  }

  send.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.focus();
</script>

</body>
</html>
