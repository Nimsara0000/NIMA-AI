services:
  - type: web
    name: nima-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300
    envVars:
      - key: OLLAMA_URL
        sync: false
      - key: MODEL_NAME
        value: nimai
      - key: OLLAMA_TIMEOUT
        value: "300"
